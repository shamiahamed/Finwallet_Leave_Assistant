server {
    listen ${PORT};
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Serve static files
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to the backend.
    # ${BACKEND_SCHEME} and ${BACKEND_TARGET} are rendered into this file at
    # container start by entrypoint.sh:
    #   Local Docker Compose:  http://backend:8000
    #   Render deployment:     https://finwallet-backend.onrender.com:443
    location /api/ {
        proxy_pass ${BACKEND_SCHEME}://${BACKEND_TARGET};
        proxy_http_version 1.1;
        proxy_set_header Host ${BACKEND_TARGET};
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # Support streaming/SSE without buffering
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;

        # Preserve request headers
        proxy_set_header Connection '';

        # TLS for HTTPS backends: send SNI and verify the certificate against
        # the system CA bundle.
        proxy_ssl_server_name on;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    }
}