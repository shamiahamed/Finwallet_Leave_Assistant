services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: finwallet-backend
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      - APP_ENV=production
      - LOG_LEVEL=INFO
      - WORKBOOK_PATH=/app/data/AI_Engineer_Leave_Management_Dataset.xlsx
      - WORKBOOK_AUTO_REFRESH=true
      - UPLOAD_DIR=/app/data/uploads
      - MAX_UPLOAD_MB=10
      - MAX_UPLOAD_ROWS=20000
      - MAX_UPLOAD_COLUMNS=100
      - MAX_RETRIEVED_CHUNKS=5
      - MIN_RELEVANCE_SCORE=0.0
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_CIRCUIT_FAILURE_THRESHOLD=3
      - GROQ_CIRCUIT_COOLDOWN_SECONDS=30
      - FRONTEND_ORIGIN=http://localhost:8080
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: finwallet-frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes: {}
